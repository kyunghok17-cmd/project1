name: Collect Trends Data

on:
  schedule:
    # 毎日 UTC 0:00 (JST 9:00, KST 9:00) に実行
    - cron: '0 0 * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run collection script
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: python trends-cron/collect_trends.py

      - name: Log completion
        run: |
          echo "✅ Data collection completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Next scheduled run: $(date -u -d '+1 day' '+%Y-%m-%d 00:00:00 UTC')"
