name: Collect Trends Data (Korea)

on:
  schedule:
    # 毎日 UTC 1:00 (KST 10:00) に実行（日本と1時間ずらす）
    - cron: '0 1 * * *'
  workflow_dispatch:  # 手動実行可能

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Korea collection script
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          python generation-trends-collector/collect_kr.py

      - name: Report status
        if: always()
        run: |
          echo "Korea collection completed at $(date)"
